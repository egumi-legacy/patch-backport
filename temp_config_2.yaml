common:
  build_command: make
  enabled_modules:
  - direct_apply
  - chunk_analyzer
  - llm_adapter
  - patch_adapter
  mode: 1
  model: qwen-plus
  module_configs:
    compiler:
      extra_flags: -j4
    kernel_compiler:
      ccache_dir: ~/.ccache
      docker_image: kernel-compiler:latest
      enabled: true
      use_docker: true
    llm_adapter:
      temperature: 0.7
      use_enhanced_prompt: false
  prompt_id: backport
  prompt_template_file: configs/test_prompts.json
  repo_base_path: ~/.cache/port-patch
  repo_name: redis
  repo_owner: redis
  repo_path: /home/elpsy/.cache/port-patch/redis
  repo_url: https://github.com/redis/redis
  response_file: response.txt
  retry_with_feedback: false
  stop_on_failure: false
  target_version: 4.0.14
  use_cached_llm_output: false
  use_cached_patches: false
mode1:
  branch: 4.0.14
  patch_url: https://github.com/redis/redis/commit/7f486ea6eebf0afce74f2e59763b9b82b78629dc.patch
mode2:
  branch: linux-6.12.y
  commits_pages_end: 3
  commits_pages_start: 1
  commits_per_page: 100
  repo_url: https://github.com/gregkh/linux
  use_cached_commits: true
