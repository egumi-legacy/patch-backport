common:
  build_command: make
  enabled_modules:
  - direct_apply
  - chunk_analyzer
  - llm_adapter
  - patch_adapter
  mode: 1
  model: qwen-plus
  module_configs:
    compiler:
      extra_flags: -j4
    kernel_compiler:
      ccache_dir: ~/.ccache
      docker_image: kernel-compiler:latest
      enabled: true
      use_docker: true
    llm_adapter:
      temperature: 0.7
      use_enhanced_prompt: false
  prompt_id: backport
  prompt_template_file: configs/test_prompts.json
  repo_base_path: ../backport-test
  repo_name: rails
  repo_owner: rails
  repo_path: ../backport-test/rails
  repo_url: https://github.com/rails/rails
  response_file: response.txt
  retry_with_feedback: false
  stop_on_failure: false
  target_version: v5.2.7
  use_cached_llm_output: true
  use_cached_patches: true
mode1:
  branch: v5.2.7
  patch_url: https://github.com/rails/rails/commit/fb493bebae1a9b83e494fe7edbf01f6167d606fd
mode2:
  branch: linux-6.12.y
  commits_pages_end: 3
  commits_pages_start: 1
  commits_per_page: 100
  repo_url: https://github.com/gregkh/linux
  use_cached_commits: true
